[package]
name = "feat_android"
version.workspace = true
authors.workspace = true
edition.workspace = true
license-file = "./LICENSE"
repository.workspace = true
description = "xPlatform mobile"

# ---

[lib]
path = "src/lib.rs"
crate-type = ["cdylib"]

[dependencies]
android-activity = { version = "0.6", features = ["native-activity"] }
feat_shared = { path = ".." }
jni = "0.21"
slint = { version = "1.15", default-features = false, features = ["backend-android-activity-06", "renderer-femtovg", "compat-1-2"] }

[package.metadata.android]
package = "com.mikko.xplatform"
apk_name = "xPlatform"
build_targets = ["aarch64-linux-android"]
strip = "strip"
use_aapt2 = true
resources = "./res"
java_sources = "java"

[package.metadata.android.sdk]
min_sdk_version = 34
target_sdk_version = 35

[[package.metadata.android.uses_permission]]
name = "android.permission.INTERNET"

[[package.metadata.android.uses_permission]]
name = "android.permission.FOREGROUND_SERVICE"

[[package.metadata.android.uses_permission]]
name = "android.permission.FOREGROUND_SERVICE_DATA_SYNC"

[[package.metadata.android.uses_permission]]
name = "android.permission.POST_NOTIFICATIONS"

[package.metadata.android.application]
has_code = true
debuggable = false
label = "xPlatform"
icon = "@mipmap/ic_launcher"
round_icon = "@mipmap/ic_launcher"

[[package.metadata.android.application.service]]
name = ".TrayService"
foreground_service_type = "dataSync"
exported = false

[[package.metadata.android.application.activity]]
name = ".MainActivity"
label = "xPlatform"
launch_mode = "singleTask"
resizeable_activity = true
config_changes = "orientation|keyboardHidden|screenSize|smallestScreenSize|screenLayout|density"

[[package.metadata.android.application.activity.meta_data]]
name = "android.app.lib_name"

[[package.metadata.android.application.activity.intent_filter]]
actions = ["android.intent.action.VIEW", "android.intent.action.MAIN"]
categories = ["android.intent.category.LAUNCHER"]
