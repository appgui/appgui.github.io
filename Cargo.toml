[package]
name = "feat_shared"
version.workspace = true
authors.workspace = true
build = "build.rs"
edition.workspace = true
license-file.workspace = true
publish = false

# ---

[build-dependencies]
slint-build = "1.15"

[dependencies]
dirs = "5"
lazy_static = { workspace = true }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
serde = { version = "1.0", features = ["derive"] }
slint = { version = "1.15", default-features = false, features = ["std", "compat-1-2"] }
sysinfo = "0.38"
tokio = { workspace = true, features = ["rt-multi-thread"] }
toml = "1"
ureq = { version = "2", features = ["tls", "json"] }

[lib]
path = "src/lib.rs"
crate-type = ["rlib"]

[profile.release]
codegen-units = 1
debug = false
debug-assertions = false
incremental = false
lto = true
opt-level = 3
overflow-checks = false
panic = 'unwind'
rpath = false
strip = true

[workspace]
members = ["feat_android", "feat_desktop"]
resolver = "3"

[workspace.package]
version = "1.0.0"
authors = ["Mikhail Timofeev <mikko.timofeev@gmail.com>"]
edition = "2024"
license-file = "./LICENSE"
repository = "https://gitlab.com/appgui/appgui.gitlab.io"

[workspace.dependencies]
lazy_static = "1.5"
tokio = { version = "1.49", features = ["rt", "time", "macros"] }
