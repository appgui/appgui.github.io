[package]
name = "feat_shared"
version = "0.0.1"
authors = ["Mikhail Timofeev <mikko.timofeev@gmail.com>"]
edition = "2024"
publish = false
build = "build.rs"
license-file = "./LICENSE-MIT"

[lib]
path = "src/lib.rs"
crate-type = ["rlib"]

[build-dependencies]
slint-build = "1.14.1"

[dependencies]
# Need the compiler feature to generate AppWindow from .slint files
slint = { version = "1.14.1", features = ["compat-1-2"] }
# For loading the icon from embedded bytes
image = { version = "0.25", default-features = false, features = ["png"] }
sysinfo = "0.38.0"

[workspace]
members = ["./feat_desktop", "./feat_android", "./_android"]
resolver = "3"

[profile.release]
codegen-units = 1
debug = false
debug-assertions = false
incremental = false
lto = true
opt-level = 3
overflow-checks = false
panic = 'unwind'
rpath = false
strip = true
