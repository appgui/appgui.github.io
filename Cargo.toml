[package]
name = "feat_shared"
version.workspace = true
authors.workspace = true
build = "build.rs"
edition.workspace = true
license-file.workspace = true
publish = false

# ---

[build-dependencies]
slint-build = "1.15"

[dependencies]
slint = { version = "1.15", default-features = false, features = ["compat-1-2"] }
sysinfo = "0.38"

[lib]
path = "src/lib.rs"
crate-type = ["rlib"]

[profile.release]
codegen-units = 1
debug = false
debug-assertions = false
incremental = false
lto = true
opt-level = 3
overflow-checks = false
panic = 'unwind'
rpath = false
strip = true

[workspace]
members = ["feat_desktop", "feat_mobile"]
resolver = "3"

[workspace.package]
version = "0.0.1"
authors = ["Mikhail Timofeev <mikko.timofeev@gmail.com>"]
edition = "2024"
license-file = "./LICENSE-MIT"
repository = "https://gitlab.com/mikko-timofeev/xPlatform"
