variables:
  FF_SCRIPT_SECTIONS: 'true'

stages:
  - trigger-github-build

trigger-github-multiplatform-build:
  stage: trigger-github-build
  image: alpine/curl:latest
  variables:
    # Ensure GITHUB_REPO and GITHUB_TOKEN are set in your CI/CD Settings
    #   GITHUB_REPO - xPlatform repo address
    #   GITHUB_TOKEN - fine-grained token with access to GITHUB_REPO (Actions: rw, Contents: rw, Metadata)
    GITHUB_REPO: $GITHUB_REPO
    GITHUB_TOKEN: $GITHUB_TOKEN
  script:
    - TAG=${CI_COMMIT_TAG}
    - echo "Triggering build for tag $TAG on repo $GITHUB_REPO"
    - |
      # Requesting build by curl POST request to GitHub
      #   -f (fail) to exit with an error code on 400/500 errors
      #   -o /dev/null to not print the empty success body
      #   -w "%{http_code}" to capture the status code
      
      HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" -X POST \
        -H "Accept: application/vnd.github.v3+json" \
        -H "Authorization: Bearer $GITHUB_TOKEN" \
        -H "Content-Type: application/json" \
        https://api.github.com/repos/$GITHUB_REPO/dispatches \
        -d "{
          \"event_type\": \"build-release\",
          \"client_payload\": {
            \"tag\": \"$TAG\",
            \"gitlab_repo\": \"$CI_REPOSITORY_URL\",
            \"gitlab_commit\": \"$CI_COMMIT_SHA\"
          }
        }")

    - |
      if [ "$HTTP_STATUS" -eq 204 ]; then
        echo '[DONE] Trigger sent successfully to GitHub (Status: 204).'
      else
        echo "[FAIL] Failed to trigger GitHub. HTTP Status: $HTTP_STATUS"
        echo 'Check your GITHUB_TOKEN permissions and GITHUB_REPO name.'
        exit 1
      fi
  only:
    - tags