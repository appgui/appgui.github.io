variables:
  FF_SCRIPT_SECTIONS: 'true'

# Ensure GITHUB_REPO and GITHUB_TOKEN are set in CI/CD Settings
#   GITHUB_REPO - xPlatform repo address
#   GITHUB_TOKEN - fine-grained token with access to GITHUB_REPO (Actions: rw, Contents: rw, Metadata)
# (if the above variables are set as Protected, they acan only be used with protected tags)

stages:
  - trigger-github-build

trigger-github-multiplatform-build:
  stage: trigger-github-build
  image: alpine/curl:latest
  script:
    - TAG=${CI_COMMIT_TAG}
    - echo "Triggering GitHub Dispatch for tag $TAG..."
    - |
      HTTP_STATUS=$(curl -s -X POST \
        -H "Accept: application/vnd.github.v3+json" \
        -H "Authorization: Bearer $GITHUB_TOKEN" \
        -H "Content-Type: application/json" \
        https://api.github.com/repos/$GITHUB_REPO/dispatches \
        -d "{
          \"event_type\": \"build-release\",
          \"client_payload\": {
            \"tag\": \"$TAG\",
            \"gitlab_repo\": \"$CI_REPOSITORY_URL\",
            \"gitlab_commit\": \"$CI_COMMIT_SHA\"
          }
        }" \
        -o response.json \
        -w "%{http_code}")

    - |
      echo "------------------------------------------"
      echo "[INFO] HTTP Status: $HTTP_STATUS"

      # GitHub returns an empty body on 204 (Success)
      # If there is a body (Errors like 401, 404, 422), print it
      if [ -s response.json ]; then
        echo "[INFO] Response:"
        cat response.json
      fi
      echo "------------------------------------------"
    - |
      if [ "$HTTP_STATUS" -eq 204 ]; then
        echo '[DONE] Trigger sent successfully to GitHub (Status: 204).'
      else
        echo "[FAIL] Failed to trigger GitHub. HTTP Status: $HTTP_STATUS"
        echo 'Check your GITHUB_TOKEN permissions and GITHUB_REPO name.'
        exit 1
      fi
  only:
    - tags
