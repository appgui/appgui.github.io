[package]
name = "feat_desktop"
version = "0.0.1"
edition = "2024"

[[bin]]
name = "xPlatform"
path = "src/main.rs"

[dependencies]
feat_shared = { path = "../" }
slint = { version = "1.15", default-features = false, features = ["std", "backend-winit", "renderer-skia", "compat-1-2", "unstable-winit-030"] }
i-slint-backend-winit = "1.15"
winit = { version = "0.30", features = ["wayland", "x11"] }

[package.metadata.bundle]
name = "xPlatform"
identifier = "com.mikko.xplatform"
icon = ["assets/icon.png"] # relative to workspace root
