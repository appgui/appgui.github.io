[package]
name = "feat_desktop"
version.workspace = true
authors.workspace = true
build = "build.rs"
edition.workspace = true
license-file.workspace = true
repository.workspace = true
description = "appGUI desktop"

# ---

[[bin]]
name = "appGUI"
path = "src/main.rs"

[build-dependencies]
winresource = "0.1.30"

[dependencies]
feat_shared = { path = ".." }
i-slint-backend-winit = "1.15"
slint = { version = "1.15", default-features = false, features = ["std", "backend-winit", "renderer-skia", "compat-1-2", "unstable-winit-030"] }
winit = { version = "0.30", features = ["wayland", "x11"] }

# Tray icon and notifications
image = { version = "0.25", default-features = false, features = ["png"] }
lazy_static = { workspace = true }
notify-rust = "4.11"

# Tray icon - Linux uses ksni
[target.'cfg(target_os = "linux")'.dependencies]
ksni = { version = "0.3", features = ["blocking"] }
tokio = { workspace = true }

# Tray icon - Windows
[target.'cfg(target_os = "windows")'.dependencies]
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "macros"] }
tray-icon = "0.21"

# Tray icon - MacOS
[target.'cfg(target_os = "macos")'.dependencies]
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "macros"] }
tray-icon = "0.21"

[package.metadata.bundle]
name = "appGUI"
identifier = "ch.lehrax.appgui"
# version = "0.0.1"
icon = ["assets/icon.svg", "assets/icon.ico"] # relative to workspace root (on linux )
copyright = "Copyright © 2026"
short_description = "GUI application"

[package.metadata.winresource]
OriginalFilename = "appGUI.exe"
LegalCopyright = "Copyright © 2026"
FileDescription = "GUI application"
ProductName = "appGUI"
# ProductVersion = "0.0.1"
