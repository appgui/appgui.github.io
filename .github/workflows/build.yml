name: appGUI Build

on:
  repository_dispatch:
    types: [build-release]
  push:
    tags: ['v*']

env:
  # for signing Windows binary (optional - requires manual setup)
  CERTIFICATE_COMPANY: ${{ secrets.WINDOWS_CERTIFICATE_COMPANY }}
  CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
  CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}

jobs:
  build:
    strategy:
      fail-fast: false # must produce at least something
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-26.04
          - platform: linux/arm64
            runner: ubuntu-26.04-arm

          - platform: windows/amd64
            runner: windows-2025 # windows-latest
          # - platform: windows/arm64
          #   runner: windows-11-arm

          - platform: macos/arm64
            runner: xcode-27 # macos-latest

    runs-on: ${{ matrix.runner }}

    steps:
      # Determine checkout method based on trigger type
      - name: Checkout source code
        shell: bash
        run: |
          # Handle both GitHub tag push and repository_dispatch triggers
          if [ -n "${{ github.event.client_payload.gitlab_repo }}" ]; then
            # GitLab repository dispatch trigger
            REPO_URL="${{ github.event.client_payload.gitlab_repo }}"
            TAG="${{ github.event.client_payload.tag }}"
            echo "Using GitLab repository dispatch: $REPO_URL@$TAG"
            git clone --depth 1 --branch "$TAG" "$REPO_URL" .
          else
            # GitHub tag push trigger - use checkout action
            echo "Using GitHub tag trigger: ${{ github.ref }}"
            git clone --depth 1 --branch "${{ github.ref_name }}" "${{ github.server_url }}/${{ github.repository }}" .
          fi

      - name: Install just
        uses: extractions/setup-just@v2

      - name: Build (Android)
        if: matrix.platform == 'linux/amd64'
        env:
          ANDROID_KEYSTORE_PATH: release.keystore
          ANDROID_KEY_ALIAS: release
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          just linux_debian_set_deps
          # Only run android_setup if we have keystore credentials
          if [ -n "$ANDROID_KEY_PASSWORD" ] && [ -n "$ANDROID_KEYSTORE_PASSWORD" ]; then
            just android_setup
            just android_build
          else
            echo "Skipping Android build: keystore credentials not configured"
          fi

      - name: Build (Linux amd64)
        if: matrix.platform == 'linux/amd64'
        run: |
          just linux_debian_set_deps
          just linux build x86_64-unknown-linux-gnu

      - name: Build (Linux arm64)
        if: matrix.platform == 'linux/arm64'
        run: |
          just linux_debian_set_deps
          just linux build aarch64-unknown-linux-gnu

      - name: Build (MacOS arm64)
        if: runner.os == 'macOS'
        run: |
          just macos_set_deps
          just macos build aarch64-apple-darwin

      - name: Build (Windows amd64)
        if: matrix.platform == 'windows/amd64'
        run: |
          just windows_set_deps
          just windows build x86_64-pc-windows-gnu

      - name: Build (Windows arm64)
        if: matrix.platform == 'windows/arm64'
        run: |
          just windows_set_deps
          just windows build aarch64-pc-windows-msvc

      - name: Collect build artifacts
        shell: bash
        run: |
          mkdir -p release-artifacts
          # Collect built binaries and APKs
          find target -name "appgui*" -o -name "appGUI*" -type f -executable 2>/dev/null | while read file; do
            if [ -f "$file" ]; then
              cp "$file" release-artifacts/ || true
            fi
          done
          find feat_android/target -name "*.apk" -type f 2>/dev/null | while read file; do
            if [ -f "$file" ]; then
              cp "$file" release-artifacts/ || true
            fi
          done
          ls -lah release-artifacts/ || echo "No artifacts collected"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.platform }}
          path: release-artifacts/
          retention-days: 5
          if-no-files-found: warn

  create-release-and-pages:
    needs: build
    runs-on: ubuntu-slim
    if: github.event.client_payload.tag || startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
      pages: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare release and pages assets
        run: |
          VERSION="${{ github.event.client_payload.tag }}"
          if [ -z "$VERSION" ]; then
            VERSION="${GITHUB_REF#refs/tags/}"
          fi

          # Create directories
          mkdir -p release-assets
          mkdir -p public

          # Copy all artifacts to release directory
          # flatten artifact names so per-platform files with the same name don't collide
          find artifacts -type f | while read -r f; do
            rel="${f#artifacts/}"
            rel="${rel#build-}"
            name="${rel//\//-}"
            cp "$f" "release-assets/$name"
            cp "$f" "public/$name"
          done

          # Generate checksums
          cd release-assets
          sha256sum * > SHA256SUMS 2>/dev/null || true
          md5sum * > MD5SUMS 2>/dev/null || true
          cd ..

          echo "Release assets prepared for version: $VERSION"
          ls -lah release-assets/

      - name: Create Release Notes
        run: |
          VERSION="${{ github.event.client_payload.tag }}"
          if [ -z "$VERSION" ]; then
            VERSION="${GITHUB_REF#refs/tags/}"
          fi

          cat > release-notes.md << EOF
          ## Release ${VERSION}

          ### Build Artifacts

          This release includes binary packages for the following platforms:

          - **Linux x86_64** - Linux GNU C library
          - **Linux ARM64** - ARM 64-bit architecture
          - **Windows x86_64** - Windows 10+ with MinGW runtime
          - **macOS ARM64** - Apple Silicon (M1+)
          - **Android** - ARM64 APK package

          ### Installation & Verification

          Please verify downloaded files using the provided checksums:

          \`\`\`bash
          sha256sum -c SHA256SUMS
          \`\`\`

          ### Release Date
          #
          Generated: $(date -u +'%Y-%m-%d %H:%M:%S UTC')

          For more information, visit the [project repository](https://github.com/${{ github.repository }})
          EOF

          cat release-notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.event.client_payload.tag || github.ref_name }}
          name: Release ${{ github.event.client_payload.tag || github.ref_name }}
          body_path: release-notes.md
          files: |
            release-assets/*
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy-to-pages:
    needs: create-release-and-pages
    runs-on: ubuntu-slim
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
